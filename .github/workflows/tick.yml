# One market turn on the deployed relayer: reprices merchants, records street trade, collects rent once per market day.
# MANUAL ONLY: no schedule, so pushing this repo never starts automated testnet transactions.
# Missed or late runs are harmless: the market day comes from the wall clock, the relayer takes one turn at a time
# (atomic lock), and rent and settlement are once per market day in the contract.
# To keep the city trading when nobody plays, the owner can add back, under `on:`:
#   schedule:
#     - cron: "*/5 * * * *"
name: market turn
on:
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/near/tick
        run: curl -fsS --max-time 75 -X POST -H 'content-type: application/json' -d '{}' https://vivolith.vercel.app/api/near/tick | head -c 600
