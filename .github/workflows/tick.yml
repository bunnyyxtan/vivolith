# Keeps the city trading when nobody plays: one market turn every 5 minutes on the deployed relayer.
# Missed or late runs are harmless: the market day comes from the wall clock, the relayer takes one turn at a time
# (atomic lock), and rent and settlement are once per market day in the contract.
name: market turn
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/near/tick
        run: curl -fsS --max-time 75 -X POST -H 'content-type: application/json' -d '{}' https://vivolith.vercel.app/api/near/tick | head -c 600
