[package]
name = "vivolith-market"
version = "0.1.0"
edition = "2021"
description = "VIVOLITH market: NEP-245 multi-token ledger for goods, coin and stall shares"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
