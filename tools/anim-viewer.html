<!doctype html>
<!-- Dev-only animation viewer: npm run dev, then open http://localhost:5173/tools/anim-viewer.html
     Two characters side by side, any clip, slow motion, a frame scrubber, foot trails.
     Not part of the production build (vite.config.ts builds index.html and legacy.html only). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animation viewer</title>
<style>
  body { margin: 0; background: #1d2126; color: #e8e8e4; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 16px; padding: 10px 14px; background: #111418cc; flex-wrap: wrap; align-items: center; }
  .side { display: flex; gap: 6px; align-items: center; }
  select, button, input { font: inherit; }
  button { background: #2c333b; color: inherit; border: 1px solid #47515c; padding: 3px 9px; border-radius: 3px; cursor: pointer; }
  button.on { background: #2f8f83; border-color: #3fb4a5; }
  #info { position: fixed; bottom: 10px; left: 14px; color: #aeb6bd; }
  label { color: #aeb6bd; }
</style>
</head>
<body>
<div id="ui">
  <div class="side"><b>Left</b> <select id="mA"></select></div>
  <div class="side"><b>Right</b> <select id="mB"></select></div>
  <div class="side" id="clips"></div>
  <div class="side"><label>speed</label><input id="speed" type="range" min="0.1" max="1.5" step="0.05" value="1"><span id="sv">1.00x</span></div>
  <div class="side"><button id="pause">Pause</button><label>frame</label><input id="scrub" type="range" min="0" max="1" step="0.002" value="0" style="width:180px"></div>
  <div class="side"><label><input id="trails" type="checkbox" checked> foot trails</label></div>
</div>
<div id="info">Drag to orbit, wheel to zoom. Same clip name plays on both; a missing clip shows the bind pose.</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { loadGLB } from "/src/assets.ts";

const MODELS = {
  "Pema (Tripo rig v1.0)": "/models/v2/cast/merchant_fruit.glb",
  "Kavi (Tripo clips)": "/models/v2/kavi.glb",
  "Remy (Mixamo player.glb)": "/models/player.glb",
  "Pema cast (Mixamo clips)": "/models/v2/cast/pema.glb",
};
const HEIGHT = 1.7;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2126);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 5, 4); scene.add(sun);
scene.add(new THREE.GridHelper(10, 40, 0x56616c, 0x2d343b));
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 1.3, 5.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const slots = [{ x: -0.9 }, { x: 0.9 }];
let clipName = "Walk", paused = false, speed = 1;

async function load(slot, url) {
  if (slot.root) scene.remove(slot.root, slot.trailL, slot.trailR);
  const g = await loadGLB(url);
  const root = g.scene;
  const box = new THREE.Box3().setFromObject(root);
  root.scale.setScalar(HEIGHT / (box.max.y - box.min.y));
  root.position.set(slot.x, -box.min.y * root.scale.y, 0);
  scene.add(root);
  const bone = (re) => { let b = null; root.traverse((o) => { if (!b && o.isBone && re.test(o.name)) b = o; }); return b; };
  Object.assign(slot, { root, clips: g.animations, mixer: new THREE.AnimationMixer(root), action: null,
    footL: bone(/LeftToe|LeftFoot/i), footR: bone(/RightToe|RightFoot/i) });
  slot.trailL = trail(0xffb347); slot.trailR = trail(0x5ec8ff);
  play(slot);
}
function trail(color) {
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(600 * 3), 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color })); line.userData.n = 0; scene.add(line); return line;
}
function play(slot) {
  if (!slot.mixer) return;
  slot.mixer.stopAllAction();
  const clip = slot.clips.find((c) => c.name.toLowerCase() === clipName.toLowerCase());
  slot.action = clip ? slot.mixer.clipAction(clip).play() : null;
  for (const t of [slot.trailL, slot.trailR]) { t.userData.n = 0; t.geometry.setDrawRange(0, 0); }
  renderClipButtons();
}
function renderClipButtons() {
  const names = [...new Set(slots.flatMap((s) => (s.clips ?? []).map((c) => c.name)))];
  const box = document.getElementById("clips"); box.innerHTML = "";
  for (const n of names) {
    const b = document.createElement("button"); b.textContent = n; if (n.toLowerCase() === clipName.toLowerCase()) b.className = "on";
    b.onclick = () => { clipName = n; slots.forEach(play); }; box.appendChild(b);
  }
}
function pushTrail(line, bone) {
  if (!bone || !document.getElementById("trails").checked) { line.visible = false; return; }
  line.visible = true;
  const p = new THREE.Vector3(); bone.getWorldPosition(p);
  const arr = line.geometry.attributes.position.array, n = line.userData.n % 600;
  arr.set([p.x, p.y, p.z], n * 3); line.userData.n++;
  line.geometry.attributes.position.needsUpdate = true; line.geometry.setDrawRange(0, Math.min(line.userData.n, 600));
}

for (const [id, slot, pick] of [["mA", slots[0], 0], ["mB", slots[1], 1]]) {
  const sel = document.getElementById(id);
  for (const name of Object.keys(MODELS)) sel.add(new Option(name, MODELS[name]));
  sel.selectedIndex = pick;
  sel.onchange = () => load(slot, sel.value);
  load(slot, sel.value);
}
document.getElementById("speed").oninput = (e) => { speed = +e.target.value; document.getElementById("sv").textContent = speed.toFixed(2) + "x"; };
document.getElementById("pause").onclick = (e) => { paused = !paused; e.target.textContent = paused ? "Play" : "Pause"; };
document.getElementById("scrub").oninput = (e) => {
  paused = true; document.getElementById("pause").textContent = "Play";
  for (const s of slots) if (s.action) { s.action.time = +e.target.value * s.action.getClip().duration; s.mixer.update(0); }
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (const s of slots) {
    if (!s.mixer) continue;
    if (!paused) s.mixer.update(dt * speed);
    s.root.updateMatrixWorld(true);
    pushTrail(s.trailL, s.footL); pushTrail(s.trailR, s.footR);
  }
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
