    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1220; font-family: "Inter Tight", system-ui, sans-serif; }
      canvas#game { display: block; width: 100vw; height: 100vh; }
      /* The loader paints with the page, before any script: the N Spire drawn as an architect's line, one stroke per
         share of the city's real download (src/v2/menu.ts drives it), then lit while the market is assembled. */
      #boot { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; color: #eef2ef; user-select: none;
        background: radial-gradient(120% 85% at 50% 118%, #21434f 0%, #12253a 36%, #0a1220 72%); transition: opacity 1.1s cubic-bezier(.45,0,.2,1); }
      #boot .stack { display: flex; flex-direction: column; align-items: center; transform: translateY(-2vh); }
      #boot svg { width: min(700px, 84vw); height: auto; overflow: visible; }
      #boot svg path { fill: none; stroke: #e4ede9; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke 1s ease; }
      #boot svg .sun { stroke: #00ec97; stroke-width: 1; opacity: .55; }
      #boot svg rect { fill: #00ec97; opacity: 0; transition: opacity .5s; }
      #boot.build svg rect { animation: lit 2.6s ease-in-out infinite; animation-delay: calc(var(--d) * 170ms); }
      #boot.ready svg path { stroke: #00ec97; }
      #boot.ready svg rect { animation: none; opacity: .95; }
      @keyframes lit { 0%, 100% { opacity: .12; } 45% { opacity: .9; } }
      #boot .mark { width: 56px; height: 56px; margin-top: 34px; animation: markIn 1.2s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes markIn { from { opacity: 0; transform: translateY(6px) scale(.96); } }
      #boot h1 { margin: 14px 0 0; font-weight: 700; font-size: 15px; letter-spacing: .64em; padding-left: .64em; }
      #boot .stage { margin: 14px 0 0; font-size: 13px; letter-spacing: .04em; color: #b6c4c0; min-height: 1.3em; }
      #boot .count { margin: 7px 0 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #6c8090; font-variant-numeric: tabular-nums; min-height: 1.2em; }
      #boot .line { position: absolute; left: 16px; right: 16px; bottom: clamp(20px, 6vh, 56px); margin: 0; text-align: center; font-size: 13px; color: #8a9daa; transition: opacity .7s; }
      #boot .line.out { opacity: 0; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot.err .stage { color: #ff9a8b; }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot .line, #boot svg path { transition: none; }
        #boot.build svg rect { animation: none; opacity: .6; }
        #boot .mark { animation: none; }
      }
    </style>
  </head>
